<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ModernTech · Employee Management</title>

<!-- Bootstrap Icons -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Shared Stylesheet -->

<link rel="stylesheet" href="css/style.css">

<!-- Load Saved Theme Before Page Renders -->

<script>
try {
    document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("mt-theme") || "light"
    );
} catch (e) {}
</script>

</head>

<body data-page="employees">

<!-- APPLICATION LAYOUT
     Matches Attendance Page Structure -->

<div id="app">


<div class="layout">

    <!-- Sidebar Placeholder -->
    <aside
        class="sidebar"
        id="sidebar">
    </aside>

    <!-- Mobile Overlay -->
    <div
        class="scrim"
        id="scrim">
    </div>

    <!-- Main Column -->
    <div class="col">

        <!-- Dynamic Navigation -->
        <header
            class="topbar"
            id="topbar">
        </header>

        <!-- Dynamic Employee Content -->
        <main
            class="main"
            id="main">
        </main>

    </div>

</div>


</div>

<!-- MPLOYEE DETAILS MODAL -->

<div
    class="modal-bg"
    id="employeeModal">


<div class="modal">

    <div class="mhead">

        Employee Details

        <button
            id="closeModal"
            type="button">

            &times;

        </button>

    </div>

    <div
        class="mbody"
        id="modalContent">
    </div>

</div>


</div>

<!-- EDIT EMPLOYEE MODAL -->

<div
    class="modal-bg"
    id="editModal">


<div class="modal">

    <div class="mhead">

        Edit Employee

        <button
            id="closeEditModal"
            type="button">

            &times;

        </button>

    </div>

    <div class="mbody">

        <label>Name</label>

        <input
            type="text"
            id="editName"
            class="field">

        <label>Position</label>

        <input
            type="text"
            id="editPosition"
            class="field">

        <label>Department</label>

        <input
            type="text"
            id="editDepartment"
            class="field">

        <label>Contact</label>

        <input
            type="text"
            id="editContact"
            class="field">

        <label>Salary</label>

        <input
            type="number"
            id="editSalary"
            class="field">

    </div>

    <div class="mfoot">

        <button
            id="saveEmployeeBtn"
            class="btn"
            type="button">

            Save Changes

        </button>

    </div>

</div>


</div>

<!-- TOAST NOTIFICATION -->

<div
    class="toast"
    id="toast">
</div>

<div class="modal-bg" id="addEmployeeModal">
    <div class="modal" style="max-width: 500px;">
        <div class="mhead">
            <h3>Add New Employee</h3>
            <button id="closeAddModal" aria-label="Close">&times;</button>
        </div>
        <div class="mbody">
            <form id="addEmployeeForm">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="addFirstName" class="field" placeholder="Enter first name" required>
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="addLastName" class="field" placeholder="Enter last name" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="addEmail" class="field" placeholder="email@company.com" required>
                </div>
                <div class="form-group">
                    <label>Department *</label>
                    <select id="addDepartment" class="select">
                        <option value="1">Development</option>
                        <option value="2">HR</option>
                        <option value="3">QA</option>
                        <option value="4">Sales</option>
                        <option value="5">Marketing</option>
                        <option value="6">Design</option>
                        <option value="7">IT</option>
                        <option value="8">Finance</option>
                        <option value="9">Support</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" id="addPosition" class="field" placeholder="Job title">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="addPassword" class="field" placeholder="Min 6 characters" required>
                </div>
            </form>
        </div>
        <div class="mfoot">
            <button class="btn ghost" id="cancelAddBtn">Cancel</button>
            <button class="btn primary" id="saveAddBtn">+ Add Employee</button>
        </div>
    </div>
</div>

<script src="javascript/employees.js"></script>

</body>
</html>
